<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jstarly Barber</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      color: white;
      line-height: 1.6;
    }

    header {
      text-align: center;
      padding: 60px 20px 40px;
      background: #000;
    }

    header h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    header p {
      color: #bbb;
      font-size: 18px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 30px 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 28px;
    }

    .service {
      background: #1d1d1d;
      padding: 18px;
      margin: 12px 0;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .service strong {
      font-size: 17px;
    }

    .price {
      font-weight: bold;
    }

    .booking {
      text-align: center;
      margin-top: 35px;
    }

    .booking-button {
      display: inline-block;
      background: #25D366;
      color: white;
      text-decoration: none;
      padding: 16px 30px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
    }

    .info {
      margin-top: 45px;
      background: #1d1d1d;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
    }

    .info p {
      margin: 8px 0;
      color: #ccc;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

    <p>Clean cuts. Sharp looks. Professional grooming.</p>
  </header>

  <div class="container">

    <h2>Our Services</h2>

    <div class="service">
      <strong>Haircut</strong>
      <span class="price">₦15,000</span>
